[project]
name = "a5s-async-v1-benchmark"
version = "0.1.0"
description = "A5S Async v1 Benchmark: an open, reproducible benchmark of speaker-attributed transcription APIs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "huggingface-hub==0.36.2",
    "meeteval==0.4.3",
    "pyarrow==21.0.0",
    "pyyaml==6.0.3",
    "regex==2026.9.29",
    "scipy==1.18.1",
    "websockets==15.0.1",
]

[project.optional-dependencies]
prep = [            # only for building datasets (`bench prep`)
    "numpy==2.3.4",
    "soundfile==0.13.1",
    "soxr==1.0.0",
    "textgrid==1.6.1",
]

[project.scripts]
bench = "bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[dependency-groups]
dev = ["pytest==8.4.2"]
